<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple YouTube Player</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        input { width: 60%; padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
        button { padding: 10px 20px; font-size: 16px; background: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .player-container { margin-top: 20px; position: relative; width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; aspect-ratio: 16/9; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>Local YouTube Player</h2>
    <input type="text" id="urlInput" placeholder="Paste YouTube URL here...">
    <button onclick="loadVideo()">Play</button>
    
    <div class="player-container">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
